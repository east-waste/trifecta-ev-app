    <script id="app-files" type="application/json">{"app.py": "from __future__ import annotations\n\nimport pandas as pd\nimport streamlit as st\n\nfrom src.calculator import enrich_candidates, summarize_bet_set\nfrom src.estimator import DEFAULT_TRIFECTA_TAKEOUT, build_trifecta_candidates\nfrom src.ocr import extract_horse_odds_from_image\nfrom src.recommendation import (\n    EV_MODE,\n    HIT_RATE_MODE,\n    RECOMMENDATION_MODES,\n    STABLE_MODE,\n    allocate_full_budget,\n    annotate_candidates,\n    recommendation_empty_reasons,\n)\n\n\nAPP_TITLE = \"三連複 2倍回収・期待値最大化シミュレーター\"\nDISCLAIMER = (\n    \"本ツールは、入力された単勝オッズと推定モデルに基づいて、三連複の買い目と資金配分を計算するシミュレーターです。\"\n    \"表示される三連複オッズや払戻額は実際のものではなく、モデル上の推定値です。\"\n    \"的中や利益を保証するものではありません。実際の投票は自己責任で行ってください。\"\n)\nMODEL_NOTICE = (\n    \"このアプリで表示される三連複オッズや払戻額は、単勝オッズから簡易モデルで推定した値です。\"\n    \"実際のJRA等の三連複オッズ・払戻額とは異なる可能性があります。\"\n)\n\n\ndef format_yen(value: float) -> str:\n    return f\"{value:,.0f}円\"\n\n\ndef to_csv_bytes(df: pd.DataFrame) -> bytes:\n    return df.to_csv(index=False).encode(\"utf-8-sig\")\n\n\ndef bool_to_japanese(value: bool) -> str:\n    return \"はい\" if bool(value) else \"いいえ\"\n\n\ndef default_win_odds(num_horses: int) -> pd.DataFrame:\n    \"\"\"頭数に応じた単勝オッズの初期表を作る。\"\"\"\n\n    # 初期値（10頭立てのサンプル単勝オッズ）。ユーザーがすぐ編集できる。\n    odds = [\n        33.9, 18.0, 59.5, 7.9, 10.5, 3.1, 55.2, 148.7, 122.8, 1.7,\n        45.0, 60.0, 80.0, 100.0, 130.0, 160.0, 200.0, 250.0,\n    ]\n    df = pd.DataFrame(\n        {\n            \"horse_number\": list(range(1, num_horses + 1)),\n            \"horse_name\": [\"\" for _ in range(num_horses)],\n            \"win_odds\": odds[:num_horses],\n        }\n    )\n    # 小数第一位まで入力できるよう float 型を明示する（int になると小数が入らない）。\n    df[\"horse_number\"] = df[\"horse_number\"].astype(int)\n    df[\"win_odds\"] = df[\"win_odds\"].astype(float)\n    return df\n\n\ndef build_win_odds_df(num_horses: int, previous: pd.DataFrame | None = None) -> pd.DataFrame:\n    \"\"\"指定頭数の単勝オッズ表を作る。\n\n    既存の入力(previous)があれば、馬番が一致する分の単勝オッズを引き継ぐ。\n    これにより、頭数を変えて作り直しても入力済みの値が無駄に消えない。\n    \"\"\"\n\n    df = default_win_odds(num_horses)\n    if previous is not None and not previous.empty and \"win_odds\" in previous.columns:\n        prev_numbers = pd.to_numeric(previous[\"horse_number\"], errors=\"coerce\")\n        prev_odds = pd.to_numeric(previous[\"win_odds\"], errors=\"coerce\")\n        prev_names = previous[\"horse_name\"] if \"horse_name\" in previous.columns else [\"\" for _ in range(len(previous))]\n        prev_map = {\n            int(n): {\"win_odds\": float(o), \"horse_name\": str(name)}\n            for n, o, name in zip(prev_numbers, prev_odds, prev_names)\n            if pd.notna(n) and pd.notna(o)\n        }\n        df[\"win_odds\"] = [\n            prev_map.get(int(h), {\"win_odds\": float(default)})[\"win_odds\"]\n            for h, default in zip(df[\"horse_number\"], df[\"win_odds\"])\n        ]\n        df[\"horse_name\"] = [\n            prev_map.get(int(h), {\"horse_name\": \"\"})[\"horse_name\"]\n            for h in df[\"horse_number\"]\n        ]\n        df[\"win_odds\"] = df[\"win_odds\"].astype(float)\n    return df\n\n\ndef render_win_odds_editor() -> tuple[pd.DataFrame, bool]:\n    \"\"\"確定済みの単勝オッズ表を form 内で編集する。\n\n    st.data_editor は通常セル編集時に即 rerun されるため、form に入れて\n    ボタン押下時だけ値を反映・計算する。頭数の確定後にのみ呼ばれる。\n    \"\"\"\n\n    locked_num_horses = int(st.session_state[\"locked_num_horses\"])\n\n    with st.form(\"win_odds_form\", clear_on_submit=False):\n        edited = st.data_editor(\n            st.session_state.win_odds_df,\n            use_container_width=True,\n            hide_index=True,\n            num_rows=\"fixed\",\n            column_config={\n                \"horse_number\": st.column_config.NumberColumn(\n                    \"馬番\",\n                    disabled=True,\n                    format=\"%d\",\n                ),\n                \"horse_name\": st.column_config.TextColumn(\n                    \"馬名\",\n                    help=\"画像OCRで読み取った馬名。手入力・修正もできます。\",\n                ),\n                \"win_odds\": st.column_config.NumberColumn(\n                    \"単勝オッズ\",\n                    min_value=1.0,\n                    step=0.1,\n                    format=\"%.1f\",\n                    help=\"小数第一位まで入力できます（例: 32.9）。\",\n                    required=True,\n                ),\n            },\n            # 確定した頭数ごとに別ウィジェット扱いにし、古い編集状態を引きずらない。\n            key=f\"win_odds_editor_{locked_num_horses}\",\n        )\n        submitted = st.form_submit_button(\n            \"単勝オッズを反映して三連複を予想・買い方を計算する\",\n            type=\"primary\",\n            use_container_width=True,\n        )\n\n    if submitted:\n        edited = edited.copy()\n        edited[\"horse_number\"] = pd.to_numeric(edited[\"horse_number\"], errors=\"coerce\").astype(int)\n        if \"horse_name\" not in edited.columns:\n            edited[\"horse_name\"] = \"\"\n        edited[\"horse_name\"] = edited[\"horse_name\"].fillna(\"\").astype(str)\n        edited[\"win_odds\"] = pd.to_numeric(edited[\"win_odds\"], errors=\"coerce\")\n        st.session_state.win_odds_df = edited\n        return edited, True\n\n    return st.session_state.win_odds_df, False\n\n\ndef validate_win_odds(df: pd.DataFrame) -> list[str]:\n    errors: list[str] = []\n    if df.empty:\n        errors.append(\"単勝オッズを入力してください。\")\n        return errors\n\n    if df[\"win_odds\"].isna().any():\n        errors.append(\"単勝オッズが空の馬があります。\")\n    invalid = df[df[\"win_odds\"] <= 1.0]\n    if not invalid.empty:\n        numbers = \", \".join(str(int(n)) for n in invalid[\"horse_number\"].tolist())\n        errors.append(f\"単勝オッズは1.0より大きい値で入力してください。対象馬番: {numbers}\")\n    return errors\n\n\ndef validate_settings(\n    *,\n    num_horses: int,\n    budget: int,\n    unit: int,\n    max_bets: int,\n    payout_lower_ratio: float,\n    payout_upper_ratio: float,\n    odds_cap: float,\n) -> list[str]:\n    errors: list[str] = []\n    if int(num_horses) < 3:\n        errors.append(\"頭数は3以上で入力してください。\")\n    if int(budget) <= 0:\n        errors.append(\"総予算は正の整数で入力してください。\")\n    if int(unit) <= 0:\n        errors.append(\"最低購入単位は正の整数で入力してください。\")\n    if int(max_bets) < 1:\n        errors.append(\"最大買い目数は1以上で入力してください。\")\n    if float(payout_lower_ratio) >= float(payout_upper_ratio):\n        errors.append(\"目標払戻許容下限は、目標払戻許容上限より小さい値にしてください。\")\n    if float(odds_cap) <= 0:\n        errors.append(\"推定三連複オッズ上限は0より大きい値にしてください。\")\n    return errors\n\n\ndef main() -> None:\n    st.set_page_config(page_title=APP_TITLE, page_icon=\"🐎\", layout=\"wide\")\n    st.title(APP_TITLE)\n    st.info(DISCLAIMER)\n    st.warning(MODEL_NOTICE)\n\n    st.markdown(\n        \"\"\"\n        この版では、**CSVで三連複オッズを入力する方式ではなく**、\n        まず頭数を選び、各馬番の**単勝オッズ**を入力します。\n        そこから Harville 法を使って、全三連複の**推定的中確率**と**推定三連複オッズ**を自動生成します。\n        「自分が信じる確率」と「市場の三連複価格づけ」にズレがあるという仮定のもとで、\n        **2倍以上なら何でもOKではなく、2倍程度に近いモデル上の推定払戻**を狙います。\n        \"\"\"\n    )\n\n    st.sidebar.header(\"1. 条件設定\")\n    default_config = st.session_state.get(\n        \"locked_config\",\n        {\n            \"num_horses\": 10,\n            \"budget\": 10000,\n            \"target_multiplier\": 2.0,\n            \"unit\": 100,\n            \"max_bets\": 10,\n            \"positive_ev_only\": False,\n            \"recommendation_mode\": STABLE_MODE,\n            \"payout_lower_ratio\": 0.9,\n            \"payout_upper_ratio\": 1.3,\n            \"odds_cap\": 200.0,\n            \"belief_lambda\": 0.80,\n            \"market_lambda\": 1.00,\n            \"takeout\": float(DEFAULT_TRIFECTA_TAKEOUT),\n        },\n    )\n    defaults = {\n        \"num_horses\": 10,\n        \"budget\": 10000,\n        \"target_multiplier\": 2.0,\n        \"unit\": 100,\n        \"max_bets\": 10,\n        \"positive_ev_only\": False,\n        \"recommendation_mode\": STABLE_MODE,\n        \"payout_lower_ratio\": 0.9,\n        \"payout_upper_ratio\": 1.3,\n        \"odds_cap\": 200.0,\n        \"belief_lambda\": 0.80,\n        \"market_lambda\": 1.00,\n        \"takeout\": float(DEFAULT_TRIFECTA_TAKEOUT),\n    }\n    default_config = {**defaults, **default_config}\n\n    with st.sidebar.form(\"settings_form\", clear_on_submit=False):\n        num_horses_input = st.number_input(\n            \"何頭立て\",\n            min_value=3,\n            max_value=18,\n            value=int(default_config[\"num_horses\"]),\n            step=1,\n            help=\"ここで変更しても、下の確定ボタンを押すまで入力表は作り直されません。\",\n        )\n        budget_input = st.number_input(\n            \"総予算（円）\",\n            min_value=1,\n            value=int(default_config[\"budget\"]),\n            step=100,\n        )\n        target_multiplier_input = st.number_input(\n            \"目標回収倍率\",\n            min_value=0.1,\n            value=float(default_config[\"target_multiplier\"]),\n            step=0.1,\n            format=\"%.1f\",\n        )\n        unit_input = st.number_input(\n            \"最低購入単位（円）\",\n            min_value=1,\n            value=int(default_config[\"unit\"]),\n            step=100,\n        )\n        max_bets_input = st.number_input(\n            \"最大買い目数\",\n            min_value=1,\n            value=int(default_config[\"max_bets\"]),\n            step=1,\n        )\n        positive_ev_only_input = st.checkbox(\n            \"期待値がプラスの買い目のみ推奨する\",\n            value=bool(default_config[\"positive_ev_only\"]),\n        )\n        recommendation_mode_input = st.selectbox(\n            \"推奨モード\",\n            options=RECOMMENDATION_MODES,\n            index=RECOMMENDATION_MODES.index(default_config.get(\"recommendation_mode\", STABLE_MODE))\n            if default_config.get(\"recommendation_mode\", STABLE_MODE) in RECOMMENDATION_MODES\n            else 0,\n            help=(\n                \"2倍回収安定モード: 目標払戻額への近さ・的中確率・期待値をバランス評価。\"\n                \"期待値重視モード: 期待値を重視。的中率重視モード: 推定的中確率を重視。\"\n            ),\n        )\n        payout_lower_ratio_input = st.number_input(\n            \"目標払戻許容下限\",\n            min_value=0.5,\n            max_value=1.0,\n            value=float(default_config[\"payout_lower_ratio\"]),\n            step=0.05,\n            format=\"%.2f\",\n            help=\"目標払戻額に対する下限倍率。例: 0.9なら目標の90%以上。\",\n        )\n        payout_upper_ratio_input = st.number_input(\n            \"目標払戻許容上限\",\n            min_value=1.0,\n            max_value=3.0,\n            value=float(default_config[\"payout_upper_ratio\"]),\n            step=0.05,\n            format=\"%.2f\",\n            help=\"目標払戻額に対する上限倍率。例: 1.3なら目標の130%以下。\",\n        )\n        odds_cap_input = st.number_input(\n            \"推定三連複オッズ上限\",\n            min_value=10.0,\n            max_value=10000.0,\n            value=float(default_config[\"odds_cap\"]),\n            step=10.0,\n            format=\"%.1f\",\n            help=\"この値を超える推定三連複オッズは、初期状態では推奨候補から除外します。\",\n        )\n\n        st.subheader(\"推定パラメータ\")\n        belief_lambda_input = st.slider(\n            \"自分の予想の人気寄せ具合\",\n            min_value=0.50,\n            max_value=1.50,\n            value=float(default_config[\"belief_lambda\"]),\n            step=0.05,\n            help=\"値を大きくすると人気馬をより高く評価します。値を小さくすると穴馬にも確率を分散します。\",\n        )\n        market_lambda_input = st.slider(\n            \"市場オッズ推定の人気寄せ具合\",\n            min_value=0.50,\n            max_value=1.50,\n            value=float(default_config[\"market_lambda\"]),\n            step=0.05,\n            help=\"値を大きくすると人気馬をより高く評価します。値を小さくすると穴馬にも確率を分散します。\",\n        )\n        st.caption(\n            \"「自分の予想の人気寄せ具合」と「市場オッズ推定の人気寄せ具合」に差をつけることで、\"\n            \"モデル上で割安とみなされる三連複を探します。\"\n        )\n        takeout_input = st.slider(\n            \"三連複 控除率の目安\",\n            min_value=0.00,\n            max_value=0.40,\n            value=float(default_config[\"takeout\"]),\n            step=0.005,\n            format=\"%.3f\",\n            help=\"控除率は、オッズを推定するときに市場全体から差し引かれる割合の目安です。値を大きくすると推定三連複オッズは低くなります。\",\n        )\n        st.caption(\n            \"控除率は、オッズを推定するときに市場全体から差し引かれる割合の目安です。\"\n            \"値を大きくすると推定三連複オッズは低くなります。\"\n        )\n        settings_submitted = st.form_submit_button(\n            \"この条件で入力表を作成・固定する\",\n            type=\"primary\",\n            use_container_width=True,\n        )\n\n    if settings_submitted or \"locked_config\" not in st.session_state:\n        previous_df = st.session_state.get(\"win_odds_df\")\n        st.session_state.locked_config = {\n            \"num_horses\": int(num_horses_input),\n            \"budget\": int(budget_input),\n            \"target_multiplier\": float(target_multiplier_input),\n            \"unit\": int(unit_input),\n            \"max_bets\": int(max_bets_input),\n            \"positive_ev_only\": bool(positive_ev_only_input),\n            \"recommendation_mode\": str(recommendation_mode_input),\n            \"payout_lower_ratio\": float(payout_lower_ratio_input),\n            \"payout_upper_ratio\": float(payout_upper_ratio_input),\n            \"odds_cap\": float(odds_cap_input),\n            \"belief_lambda\": float(belief_lambda_input),\n            \"market_lambda\": float(market_lambda_input),\n            \"takeout\": float(takeout_input),\n        }\n        st.session_state.locked_num_horses = int(num_horses_input)\n        st.session_state.win_odds_df = build_win_odds_df(\n            int(num_horses_input),\n            previous=previous_df,\n        )\n\n    config = st.session_state.locked_config\n    num_horses = int(config[\"num_horses\"])\n    budget = int(config[\"budget\"])\n    target_multiplier = float(config[\"target_multiplier\"])\n    unit = int(config[\"unit\"])\n    max_bets = int(config[\"max_bets\"])\n    positive_ev_only = bool(config[\"positive_ev_only\"])\n    recommendation_mode = str(config[\"recommendation_mode\"])\n    payout_lower_ratio = float(config[\"payout_lower_ratio\"])\n    payout_upper_ratio = float(config[\"payout_upper_ratio\"])\n    odds_cap = float(config[\"odds_cap\"])\n    belief_lambda = float(config[\"belief_lambda\"])\n    market_lambda = float(config[\"market_lambda\"])\n    takeout = float(config[\"takeout\"])\n\n    target_payout = float(budget) * float(target_multiplier)\n    payout_lower = target_payout * payout_lower_ratio\n    payout_upper = target_payout * payout_upper_ratio\n    st.sidebar.metric(\"固定中の目標払戻額\", format_yen(target_payout))\n    st.sidebar.caption(f\"許容推定払戻範囲: {format_yen(payout_lower)}〜{format_yen(payout_upper)}\")\n\n    st.header(\"2. 単勝オッズ入力\")\n    st.success(\n        f\"入力表は {num_horses}頭立てで固定中です。\"\n        \"頭数や条件を変える場合は、左側で設定してから「この条件で入力表を作成・固定する」を押してください。\"\n    )\n\n    with st.expander(\"画像から馬番・馬名・単勝オッズを自動入力する（任意）\", expanded=False):\n        st.caption(\n            \"出馬表や単勝オッズ表のスクリーンショットをアップロードすると、Gemini API等で馬番・馬名・単勝オッズを読み取り、下の入力表へ反映します。\"\n            \"公開GitHub Pages上でAPIキーを使うのは推奨しません。ローカルStreamlit実行で使ってください。\"\n        )\n        ocr_provider = \"gemini\"\n        default_ocr_model = \"gemini-2.5-flash-lite\"\n        ocr_api_key = st.text_input(\n            \"Gemini APIキー\",\n            type=\"password\",\n            help=\"Google AI Studio（https://aistudio.google.com/）で取得した無料枠のAPIキーを入力してください。\",\n        )\n        ocr_model = st.text_input(\n            \"画像読み取りモデル\",\n            value=default_ocr_model,\n            help=\"通常は初期値（gemini-2.5-flash-lite）のままでOKです。\",\n        )\n        uploaded_odds_image = st.file_uploader(\n            \"馬番・馬名・単勝オッズが写った画像\",\n            type=[\"png\", \"jpg\", \"jpeg\", \"webp\"],\n        )\n        if st.button(\"画像から単勝オッズ表を作成する\", use_container_width=True):\n            if uploaded_odds_image is None:\n                st.error(\"画像をアップロードしてください。\")\n            elif not ocr_api_key:\n                st.error(\"Gemini APIキーを入力してください。\")\n            else:\n                try:\n                    ocr_result = extract_horse_odds_from_image(\n                        image_bytes=uploaded_odds_image.getvalue(),\n                        filename=uploaded_odds_image.name,\n                        api_key=ocr_api_key,\n                        provider=ocr_provider,\n                        model=ocr_model.strip() or default_ocr_model,\n                    )\n                    ocr_df = ocr_result.dataframe\n                    if ocr_df.empty:\n                        st.error(\"画像から単勝オッズを読み取れませんでした。画像を拡大・トリミングして再試行してください。\")\n                    else:\n                        st.session_state.win_odds_df = ocr_df[[\"horse_number\", \"horse_name\", \"win_odds\"]].copy()\n                        st.session_state.locked_num_horses = int(len(ocr_df))\n                        st.session_state.locked_config[\"num_horses\"] = int(len(ocr_df))\n                        st.success(f\"{len(ocr_df)}頭分の単勝オッズを読み取りました。入力表に反映します。\")\n                        st.dataframe(ocr_df, use_container_width=True, hide_index=True)\n                        st.rerun()\n                except Exception as exc:\n                    st.error(f\"画像読み取りに失敗しました: {exc}\")\n\n    win_odds_df, calculate_clicked = render_win_odds_editor()\n\n    st.caption(\n        \"単勝オッズから1着確率を正規化し、Harville法で3着内の組み合わせ確率を推定します。\"\n        \"自分の予想と市場オッズ推定の人気寄せ具合に差をつけることで、単勝オッズだけから「モデル上で割安そうな三連複」を探します。\"\n        \"表示される推定三連複オッズ・モデル上の推定払戻額は、実際のオッズや払戻額ではありません。\"\n    )\n\n    if not calculate_clicked:\n        return\n\n    errors = validate_win_odds(win_odds_df)\n    errors.extend(\n        validate_settings(\n            num_horses=num_horses,\n            budget=budget,\n            unit=unit,\n            max_bets=max_bets,\n            payout_lower_ratio=payout_lower_ratio,\n            payout_upper_ratio=payout_upper_ratio,\n            odds_cap=odds_cap,\n        )\n    )\n\n    if errors:\n        for error in errors:\n            st.error(error)\n        st.stop()\n\n    win_odds = {\n        int(row[\"horse_number\"]): float(row[\"win_odds\"])\n        for _, row in win_odds_df.iterrows()\n    }\n\n    raw_candidates = build_trifecta_candidates(\n        win_odds,\n        belief_lambda=float(belief_lambda),\n        market_lambda=float(market_lambda),\n        takeout=float(takeout),\n    )\n    enriched = enrich_candidates(raw_candidates, target_payout=target_payout, unit=int(unit))\n    annotated = annotate_candidates(\n        enriched,\n        budget=budget,\n        target_payout=target_payout,\n        payout_lower_ratio=payout_lower_ratio,\n        payout_upper_ratio=payout_upper_ratio,\n        odds_cap=odds_cap,\n        positive_ev_only=positive_ev_only,\n        recommendation_mode=recommendation_mode,\n    )\n    candidates = annotated[annotated[\"is_recommendation_candidate\"]].copy()\n\n    selected_records = allocate_full_budget(\n        candidates,\n        budget=int(budget),\n        unit=int(unit),\n        max_bets=int(max_bets),\n        target_payout=float(target_payout),\n        recommendation_mode=recommendation_mode,\n        payout_upper=float(payout_upper),\n    )\n    result = summarize_bet_set(selected_records)\n    budget_remaining = int(budget) - int(result[\"total_stake\"])\n    selected_df = pd.DataFrame(result[\"selected_bets\"])\n    if not selected_df.empty:\n        selected_df = selected_df.sort_values(\"score\", ascending=False).reset_index(drop=True)\n\n    st.header(\"3. 推奨買い目一覧\")\n    if selected_df.empty:\n        st.warning(\n            \"現在の条件では、予算内かつ目標払戻範囲内で購入できる買い目がありません。\"\n            \"目標払戻許容上限を広げる、推定三連複オッズ上限を広げる、最大買い目数を減らす、\"\n            \"または予算を増やしてください。\"\n        )\n        for reason in recommendation_empty_reasons(annotated, positive_ev_only=positive_ev_only):\n            st.info(reason)\n    else:\n        display = selected_df[\n            [\n                \"bet\",\n                \"odds\",\n                \"probability_percent\",\n                \"theoretical_stake\",\n                \"stake\",\n                \"payout\",\n                \"payout_diff\",\n                \"expected_value\",\n                \"score\",\n                \"memo\",\n            ]\n        ].rename(\n            columns={\n                \"bet\": \"買い目\",\n                \"odds\": \"推定三連複オッズ\",\n                \"probability_percent\": \"推定的中確率（%）\",\n                \"theoretical_stake\": \"理論購入額\",\n                \"stake\": \"実際の推奨購入額\",\n                \"payout\": \"モデル上の推定払戻額\",\n                \"payout_diff\": \"目標払戻との差\",\n                \"expected_value\": \"買い目期待値\",\n                \"score\": \"スコア\",\n                \"memo\": \"メモ\",\n            }\n        )\n        st.dataframe(\n            display,\n            use_container_width=True,\n            hide_index=True,\n            column_config={\n                \"推定三連複オッズ\": st.column_config.NumberColumn(format=\"%.1f\"),\n                \"推定的中確率（%）\": st.column_config.NumberColumn(format=\"%.4f\"),\n                \"理論購入額\": st.column_config.NumberColumn(format=\"%.1f\"),\n                \"実際の推奨購入額\": st.column_config.NumberColumn(format=\"%d\"),\n                \"モデル上の推定払戻額\": st.column_config.NumberColumn(format=\"%.0f\"),\n                \"目標払戻との差\": st.column_config.NumberColumn(format=\"%.0f\"),\n                \"買い目期待値\": st.column_config.NumberColumn(format=\"%.0f\"),\n                \"スコア\": st.column_config.NumberColumn(format=\"%.2f\"),\n            },\n        )\n\n        st.download_button(\n            \"推奨買い目結果をCSVとしてダウンロード\",\n            data=to_csv_bytes(selected_df),\n            file_name=\"trifecta_recommendation_from_win_odds.csv\",\n            mime=\"text/csv\",\n        )\n\n    st.header(\"4. セット全体のまとめ\")\n    col1, col2, col3 = st.columns(3)\n    col1.metric(\"合計購入額\", format_yen(result[\"total_stake\"]))\n    col2.metric(\"予算残り\", format_yen(budget_remaining))\n    col3.metric(\"目標払戻額\", format_yen(target_payout))\n\n    col4, col5, col6 = st.columns(3)\n    col4.metric(\"許容推定払戻範囲\", f\"{format_yen(payout_lower)}〜{format_yen(payout_upper)}\")\n    col5.metric(\"推定的中確率\", f\"{result['hit_probability']:.4f}%\")\n    col6.metric(\"モデル上の期待払戻額\", format_yen(result[\"expected_return\"]))\n\n    col7, col8, col9 = st.columns(3)\n    col7.metric(\"セット期待値\", format_yen(result[\"expected_value\"]))\n    col8.metric(\"最小推定払戻額\", format_yen(result[\"min_payout\"]))\n    col9.metric(\"最大推定払戻額\", format_yen(result[\"max_payout\"]))\n\n    col10, col11 = st.columns(2)\n    col10.metric(\"平均推定払戻額\", format_yen(result[\"average_payout\"]))\n    col11.metric(\"推奨モード\", recommendation_mode)\n\n    if not selected_df.empty:\n        if budget_remaining > 0:\n            st.warning(\n                f\"予算が{format_yen(budget_remaining)}残っています。\"\n                \"モデル上の推定払戻額が許容上限を超えない範囲で、上位の2倍程度候補を追加・上乗せしましたが、\"\n                \"これ以上使うと2倍程度から外れるため残しています。\"\n                \"予算を必ず使い切りたい場合は、最大買い目数を増やす、目標払戻許容上限を広げる、\"\n                \"推定三連複オッズ上限を広げる、または期待値プラス条件をオフにしてください。\"\n            )\n        if result[\"hit_probability\"] < 0.1:\n            st.error(\n                \"推定的中確率が0.1%未満です。これは超穴狙いに近い買い方です。\"\n                \"2倍回収を安定して狙う目的から外れている可能性があります。\"\n            )\n        elif result[\"hit_probability\"] < 1.0:\n            st.warning(\n                \"推定的中確率が1%未満です。期待値は高く見えても、かなり当たりにくい買い方になっている可能性があります。\"\n            )\n\n        if result[\"min_payout\"] < payout_lower - 1e-9 or result[\"max_payout\"] > payout_upper + 1e-9:\n            st.error(\n                \"内部警告: 推奨買い目の最小推定払戻額または最大推定払戻額が許容範囲から外れています。\"\n                \"これはバグの可能性があります。\"\n            )\n\n    if result[\"hit_probability\"] > 100:\n        st.warning(\n            f\"選択セットの推定的中確率が100%を超えています（合計: {result['hit_probability']:.2f}%）。\"\n        )\n\n    st.header(\"5. 全三連複候補ランキング\")\n    selected_bets = set(selected_df[\"bet\"].tolist()) if not selected_df.empty else set()\n    ranking = annotated.copy()\n    ranking[\"selected\"] = ranking[\"bet\"].isin(selected_bets)\n    # 推定三連複オッズの小さい順（人気順）に並べる。\n    ranking = ranking.sort_values(\"odds\", ascending=True)\n\n    ranking_display = ranking[\n        [\n            \"bet\",\n            \"odds\",\n            \"probability_percent\",\n            \"theoretical_stake\",\n            \"stake\",\n            \"payout\",\n            \"payout_diff\",\n            \"expected_value\",\n            \"score\",\n            \"within_target_payout_range\",\n            \"odds_cap_exceeded\",\n            \"selected\",\n        ]\n    ].rename(\n        columns={\n            \"bet\": \"買い目\",\n            \"odds\": \"推定三連複オッズ\",\n            \"probability_percent\": \"推定的中確率（%）\",\n            \"theoretical_stake\": \"理論購入額\",\n            \"stake\": \"必要購入額\",\n            \"payout\": \"モデル上の推定払戻額\",\n            \"payout_diff\": \"目標払戻との差\",\n            \"expected_value\": \"買い目期待値\",\n            \"score\": \"スコア\",\n            \"within_target_payout_range\": \"目標払戻範囲内か\",\n            \"odds_cap_exceeded\": \"オッズ上限超過\",\n            \"selected\": \"推奨に選択されたか\",\n        }\n    )\n    for col in [\"目標払戻範囲内か\", \"オッズ上限超過\", \"推奨に選択されたか\"]:\n        ranking_display[col] = ranking_display[col].map(bool_to_japanese)\n    st.dataframe(\n        ranking_display,\n        use_container_width=True,\n        hide_index=True,\n        column_config={\n            \"推定三連複オッズ\": st.column_config.NumberColumn(format=\"%.1f\"),\n            \"推定的中確率（%）\": st.column_config.NumberColumn(format=\"%.4f\"),\n            \"理論購入額\": st.column_config.NumberColumn(format=\"%.1f\"),\n            \"必要購入額\": st.column_config.NumberColumn(format=\"%d\"),\n            \"モデル上の推定払戻額\": st.column_config.NumberColumn(format=\"%.0f\"),\n            \"目標払戻との差\": st.column_config.NumberColumn(format=\"%.0f\"),\n            \"買い目期待値\": st.column_config.NumberColumn(format=\"%.0f\"),\n            \"スコア\": st.column_config.NumberColumn(format=\"%.2f\"),\n        },\n    )\n\n    st.download_button(\n        \"全三連複候補をCSVとしてダウンロード\",\n        # CSVは推定三連複オッズの昇順で出力する。\n        data=to_csv_bytes(ranking.sort_values(\"odds\", ascending=True)),\n        file_name=\"estimated_all_trifecta_candidates.csv\",\n        mime=\"text/csv\",\n    )\n\n    st.header(\"6. 注意事項\")\n    st.warning(\n        \"重要: この推定は単勝オッズだけを使う簡易モデルです。\"\n        \"馬場、展開、脚質、距離適性、枠順、実際の三連複投票分布は反映していません。\"\n    )\n    st.warning(MODEL_NOTICE)\n    st.caption(DISCLAIMER)\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/__init__.py": "", "src/calculator.py": "\"\"\"三連複の購入額・払戻額・期待値計算ユーティリティ。\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom typing import Iterable\n\nimport pandas as pd\n\n\ndef ceil_to_unit(value: float, unit: int) -> int:\n    \"\"\"value を unit 単位に切り上げる。\n\n    Args:\n        value: 切り上げ対象の金額。\n        unit: 最低購入単位。正の整数である必要がある。\n\n    Returns:\n        unit 単位へ切り上げた整数金額。\n    \"\"\"\n\n    if unit <= 0:\n        raise ValueError(\"unit は正の整数である必要があります。\")\n    if value <= 0:\n        return 0\n    return int(math.ceil(float(value) / unit) * unit)\n\n\ndef calculate_required_stake(target_payout: float, odds: float, unit: int) -> int:\n    \"\"\"目標払戻額を満たすための購入額を計算する。\"\"\"\n\n    if odds <= 0:\n        raise ValueError(\"odds は正の値である必要があります。\")\n    return ceil_to_unit(float(target_payout) / float(odds), unit)\n\n\ndef calculate_theoretical_stake(target_payout: float, odds: float) -> float:\n    \"\"\"丸め前の理論購入額を計算する。\"\"\"\n\n    if odds <= 0:\n        raise ValueError(\"odds は正の値である必要があります。\")\n    return float(target_payout) / float(odds)\n\n\ndef calculate_payout(stake: float, odds: float) -> float:\n    \"\"\"購入額とオッズから払戻額を計算する。\"\"\"\n\n    return float(stake) * float(odds)\n\n\ndef probability_percent_to_decimal(probability_percent: float) -> float:\n    \"\"\"パーセント表記の的中確率を 0〜1 の小数へ変換する。\"\"\"\n\n    return float(probability_percent) / 100.0\n\n\ndef calculate_expected_value(\n    probability_percent: float,\n    payout: float,\n    stake: float,\n) -> float:\n    \"\"\"買い目単位の期待値を計算する。\n\n    期待値 = 的中確率(小数) × 払戻額 - 購入額\n    \"\"\"\n\n    p = probability_percent_to_decimal(probability_percent)\n    return p * float(payout) - float(stake)\n\n\ndef enrich_candidates(\n    df: pd.DataFrame,\n    target_payout: float,\n    unit: int,\n) -> pd.DataFrame:\n    \"\"\"入力 DataFrame に購入額・払戻額・期待値列を追加する。\n\n    想定列:\n        bet, odds, probability_percent, memo\n    \"\"\"\n\n    rows: list[dict] = []\n    for _, row in df.iterrows():\n        odds = float(row[\"odds\"])\n        probability_percent = float(row[\"probability_percent\"])\n        theoretical_stake = calculate_theoretical_stake(target_payout, odds)\n        stake = calculate_required_stake(target_payout, odds, unit)\n        payout = calculate_payout(stake, odds)\n        expected_value = calculate_expected_value(probability_percent, payout, stake)\n\n        rows.append(\n            {\n                \"bet\": str(row[\"bet\"]),\n                \"odds\": odds,\n                \"probability_percent\": probability_percent,\n                \"market_probability_percent\": float(row[\"market_probability_percent\"])\n                if \"market_probability_percent\" in row and not pd.isna(row.get(\"market_probability_percent\"))\n                else None,\n                \"memo\": \"\" if pd.isna(row.get(\"memo\", \"\")) else str(row.get(\"memo\", \"\")),\n                \"theoretical_stake\": float(theoretical_stake),\n                \"stake\": int(stake),\n                \"payout\": float(payout),\n                \"payout_diff\": float(payout - float(target_payout)),\n                \"expected_value\": float(expected_value),\n            }\n        )\n\n    return pd.DataFrame(rows)\n\n\ndef summarize_bet_set(selected_bets: Iterable[dict]) -> dict:\n    \"\"\"選択された買い目セット全体の指標を集計する。\"\"\"\n\n    bets = list(selected_bets)\n    total_stake = sum(float(bet.get(\"stake\", 0)) for bet in bets)\n    expected_return = sum(\n        probability_percent_to_decimal(float(bet.get(\"probability_percent\", 0)))\n        * float(bet.get(\"payout\", 0))\n        for bet in bets\n    )\n    hit_probability = sum(float(bet.get(\"probability_percent\", 0)) for bet in bets)\n    payouts = [float(bet.get(\"payout\", 0)) for bet in bets]\n\n    return {\n        \"selected_bets\": bets,\n        \"total_stake\": int(total_stake),\n        \"expected_return\": float(expected_return),\n        \"expected_value\": float(expected_return - total_stake),\n        \"hit_probability\": float(hit_probability),\n        \"min_payout\": float(min(payouts)) if payouts else 0.0,\n        \"max_payout\": float(max(payouts)) if payouts else 0.0,\n        \"average_payout\": float(sum(payouts) / len(payouts)) if payouts else 0.0,\n    }\n", "src/optimizer.py": "\"\"\"制約を満たす候補からスコア最大の買い目セットを選ぶ。\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom typing import Iterable\n\nimport pandas as pd\n\nfrom .calculator import summarize_bet_set\n\n\ndef _to_records(candidates: Iterable[dict] | pd.DataFrame) -> list[dict]:\n    if isinstance(candidates, pd.DataFrame):\n        return candidates.to_dict(orient=\"records\")\n    return [dict(candidate) for candidate in candidates]\n\n\ndef _stake_gcd(records: list[dict], budget: int) -> int:\n    \"\"\"DP の重さ圧縮に使う購入額の最大公約数を求める。\"\"\"\n\n    values = [int(round(float(r.get(\"stake\", 0)))) for r in records if float(r.get(\"stake\", 0)) > 0]\n    values.append(int(budget))\n    gcd_value = 0\n    for value in values:\n        gcd_value = math.gcd(gcd_value, abs(value))\n    return max(gcd_value, 1)\n\n\ndef _is_better(\n    candidate_value: float,\n    candidate_stake: int,\n    candidate_hit_probability: float,\n    current_value: float,\n    current_stake: int,\n    current_hit_probability: float,\n) -> bool:\n    \"\"\"DP の同点比較。\n\n    第一優先: 期待値が大きい\n    第二優先: 購入額が小さい\n    第三優先: 推定的中確率が大きい\n    \"\"\"\n\n    eps = 1e-9\n    if candidate_value > current_value + eps:\n        return True\n    if abs(candidate_value - current_value) <= eps:\n        if candidate_stake < current_stake:\n            return True\n        if candidate_stake == current_stake and candidate_hit_probability > current_hit_probability + eps:\n            return True\n    return False\n\n\ndef optimize_bets(\n    candidates: Iterable[dict] | pd.DataFrame,\n    budget: int,\n    max_bets: int,\n    positive_ev_only: bool = True,\n    value_column: str = \"expected_value\",\n) -> dict:\n    \"\"\"候補から指定 value_column の合計が最大となる買い目セットを選ぶ。\n\n    Args:\n        candidates: stake, payout, expected_value, probability_percent を持つ候補。\n        budget: 総予算。\n        max_bets: 選択できる最大買い目数。\n        positive_ev_only: True の場合は期待値が 0 以下の買い目を除外する。\n        value_column: DPで最大化する列名。従来互換の初期値は expected_value。\n\n    Returns:\n        selected_bets, total_stake, expected_return, expected_value,\n        hit_probability, min_payout, max_payout を含む辞書。\n    \"\"\"\n\n    if budget <= 0:\n        raise ValueError(\"budget は正の整数である必要があります。\")\n    if max_bets < 1:\n        raise ValueError(\"max_bets は1以上である必要があります。\")\n\n    records = _to_records(candidates)\n    filtered: list[dict] = []\n    for record in records:\n        stake = int(round(float(record.get(\"stake\", 0))))\n        expected_value = float(record.get(\"expected_value\", 0))\n        if stake <= 0 or stake > budget:\n            continue\n        if positive_ev_only and expected_value <= 0:\n            continue\n        copied = dict(record)\n        copied[\"stake\"] = stake\n        filtered.append(copied)\n\n    if not filtered:\n        return summarize_bet_set([])\n\n    unit = _stake_gcd(filtered, budget)\n    capacity = int(budget // unit)\n\n    # dp[k][w] = (期待値, 合計購入額, 的中確率合計, 選択index tuple)\n    dp: list[list[tuple[float, int, float, tuple[int, ...]] | None]] = [\n        [None for _ in range(capacity + 1)] for _ in range(max_bets + 1)\n    ]\n    dp[0][0] = (0.0, 0, 0.0, tuple())\n\n    for idx, record in enumerate(filtered):\n        stake = int(record[\"stake\"])\n        weight = int(stake // unit)\n        value = float(record.get(value_column, record.get(\"expected_value\", 0)))\n        hit_probability = float(record.get(\"probability_percent\", 0))\n\n        for k in range(max_bets - 1, -1, -1):\n            for w in range(capacity - weight, -1, -1):\n                state = dp[k][w]\n                if state is None:\n                    continue\n                prev_value, prev_stake, prev_hit, prev_indices = state\n                new_k = k + 1\n                new_w = w + weight\n                new_value = prev_value + value\n                new_stake = prev_stake + stake\n                new_hit = prev_hit + hit_probability\n                current = dp[new_k][new_w]\n\n                if current is None or _is_better(\n                    new_value,\n                    new_stake,\n                    new_hit,\n                    current[0],\n                    current[1],\n                    current[2],\n                ):\n                    dp[new_k][new_w] = (new_value, new_stake, new_hit, prev_indices + (idx,))\n\n    # 候補が存在する場合は、できるだけ非空の組み合わせを推奨する。\n    # （スコアが負になりうるモードでも、範囲内候補があれば買い目を提示する）\n    best: tuple[float, int, float, tuple[int, ...]] | None = None\n    for k in range(1, max_bets + 1):\n        for w in range(capacity + 1):\n            state = dp[k][w]\n            if state is None:\n                continue\n            if best is None or _is_better(\n                state[0], state[1], state[2], best[0], best[1], best[2]\n            ):\n                best = state\n\n    if best is None:\n        return summarize_bet_set([])\n\n    selected = [filtered[i] for i in best[3]]\n    return summarize_bet_set(selected)\n", "src/estimator.py": "\"\"\"単勝オッズから三連複の的中確率・オッズを推定する（Harville法）。\"\"\"\n\nfrom __future__ import annotations\n\nfrom itertools import combinations, permutations\nfrom typing import Mapping\n\nimport pandas as pd\n\n# 三連複オッズを推定するときの控除率の初期値。\n# 実際の控除率は主催者・券種・時期で異なるため、アプリ側で調整できるようにしている。\nDEFAULT_TRIFECTA_TAKEOUT = 0.25\n\n\ndef win_odds_to_win_probabilities(win_odds: Mapping[int, float]) -> dict[int, float]:\n    \"\"\"単勝オッズを正規化した1着確率へ変換する。\n\n    各馬の暫定勝率 = 1 / 単勝オッズ。\n    控除率が含まれ合計が1を超えるため、全体で正規化する。\n    \"\"\"\n\n    inverse = {\n        horse: 1.0 / float(odds)\n        for horse, odds in win_odds.items()\n        if odds is not None and float(odds) > 0\n    }\n    total = sum(inverse.values())\n    if total <= 0:\n        raise ValueError(\"有効な単勝オッズが1件もありません。\")\n    return {horse: value / total for horse, value in inverse.items()}\n\n\ndef harville_trifecta_probabilities(\n    win_probabilities: Mapping[int, float],\n    lam: float = 1.0,\n) -> dict[tuple[int, int, int], float]:\n    \"\"\"1着確率から三連複（順不同3頭）の的中確率を計算する。\n\n    Harville法では i→j→k の順で 1,2,3着になる確率を\n        P = p_i × p_j/(1-p_i) × p_k/(1-p_i-p_j)\n    として連鎖計算する。lam は2・3着での人気馬偏重を補正する係数で、\n    lam < 1 にすると人気薄の確率を相対的に引き上げる。\n    \"\"\"\n\n    horses = list(win_probabilities.keys())\n    p = {h: float(win_probabilities[h]) for h in horses}\n    result: dict[tuple[int, int, int], float] = {}\n\n    for combo in combinations(horses, 3):\n        total = 0.0\n        for i, j, k in permutations(combo, 3):\n            p1 = p[i]\n            denom2 = sum(p[m] ** lam for m in horses if m != i)\n            p2 = (p[j] ** lam / denom2) if denom2 > 0 else 0.0\n            denom3 = sum(p[m] ** lam for m in horses if m not in (i, j))\n            p3 = (p[k] ** lam / denom3) if denom3 > 0 else 0.0\n            total += p1 * p2 * p3\n        result[tuple(sorted(combo))] = total\n\n    return result\n\n\ndef estimate_trifecta_odds(probability: float, takeout: float = DEFAULT_TRIFECTA_TAKEOUT) -> float:\n    \"\"\"的中確率（0〜1）から三連複オッズの目安を推定する。\n\n    オッズ ≒ (1 - 控除率) / 的中確率\n    \"\"\"\n\n    if probability <= 0:\n        return float(\"inf\")\n    return (1.0 - float(takeout)) / float(probability)\n\n\ndef build_trifecta_candidates(\n    win_odds: Mapping[int, float],\n    belief_lambda: float = 0.80,\n    market_lambda: float = 1.0,\n    takeout: float = DEFAULT_TRIFECTA_TAKEOUT,\n) -> pd.DataFrame:\n    \"\"\"単勝オッズから全三連複の候補（買い目・推定オッズ・推定確率）を生成する。\n\n    期待値がプラスになり得る買い目を見つけるには、「自分が信じる真の確率」と\n    「市場が三連複を価格づけする確率」がズレている必要がある。\n\n    本関数では2つの Harville モデルを使う。\n        belief: 真の確率の推定（Henery型補正。belief_lambda < 1 で人気薄の連対を高めに見積もる）\n        market: 市場の価格づけの推定（素朴な Harville。通常 market_lambda = 1.0）\n\n    推定的中確率(probability_percent) は belief 側、\n    推定三連複オッズ(odds) は market 側（控除率込み）から計算する。\n    belief_lambda == market_lambda のときは両者が一致し、\n    全買い目の期待値は -控除率×購入額 となる（＝エッジなし）。\n\n    Returns:\n        bet, odds, probability_percent, memo 列を持つ DataFrame。\n        probability_percent の降順に並ぶ。\n    \"\"\"\n\n    win_probabilities = win_odds_to_win_probabilities(win_odds)\n    belief = harville_trifecta_probabilities(win_probabilities, lam=belief_lambda)\n    market = harville_trifecta_probabilities(win_probabilities, lam=market_lambda)\n\n    rows: list[dict] = []\n    for combo, belief_probability in belief.items():\n        market_probability = market[combo]\n        odds = estimate_trifecta_odds(market_probability, takeout=takeout)\n        bet = \"-\".join(str(h) for h in combo)\n        rows.append(\n            {\n                \"bet\": bet,\n                \"odds\": round(float(odds), 1),\n                \"probability_percent\": round(float(belief_probability) * 100.0, 4),\n                \"market_probability_percent\": round(float(market_probability) * 100.0, 4),\n                \"memo\": \"単勝オッズから推定\",\n            }\n        )\n\n    df = pd.DataFrame(\n        rows,\n        columns=[\"bet\", \"odds\", \"probability_percent\", \"market_probability_percent\", \"memo\"],\n    )\n    if df.empty:\n        return df\n    # 表として自然に見えるようにオッズ昇順（＝人気順）で並べる。\n    return df.sort_values(\"odds\", ascending=True).reset_index(drop=True)\n", "src/recommendation.py": "\"\"\"推奨候補の判定と推奨モード別スコア計算。\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\n\nSTABLE_MODE = \"2倍回収安定モード\"\nEV_MODE = \"期待値重視モード\"\nHIT_RATE_MODE = \"的中率重視モード\"\nRECOMMENDATION_MODES = [STABLE_MODE, EV_MODE, HIT_RATE_MODE]\n\n# 推奨モードごとの「上位から買う」並び順の基準列。\n# 期待値重視のみ期待値順、それ以外は人気（推定的中確率）順を上位とする。\nMODE_ORDER_COLUMN = {\n    STABLE_MODE: \"probability_percent\",\n    HIT_RATE_MODE: \"probability_percent\",\n    EV_MODE: \"expected_value\",\n}\n\n\ndef calculate_score(row: pd.Series | dict, target_payout: float, mode: str) -> float:\n    \"\"\"推奨モードに応じたスコアを計算する。\"\"\"\n\n    expected_value = float(row.get(\"expected_value\", 0.0))\n    hit_probability = float(row.get(\"probability_percent\", 0.0)) / 100.0\n    payout = float(row.get(\"payout\", 0.0))\n    payout_deviation_ratio = abs(payout - float(target_payout)) / float(target_payout)\n\n    if mode == STABLE_MODE:\n        return (\n            expected_value\n            + float(target_payout) * hit_probability\n            - float(target_payout) * payout_deviation_ratio\n        )\n    if mode == EV_MODE:\n        return expected_value\n    if mode == HIT_RATE_MODE:\n        return float(target_payout) * hit_probability + expected_value * 0.3\n\n    raise ValueError(f\"未知の推奨モードです: {mode}\")\n\n\ndef annotate_candidates(\n    candidates: pd.DataFrame,\n    *,\n    budget: int,\n    target_payout: float,\n    payout_lower_ratio: float,\n    payout_upper_ratio: float,\n    odds_cap: float,\n    positive_ev_only: bool,\n    recommendation_mode: str,\n) -> pd.DataFrame:\n    \"\"\"全候補へ判定列・スコア列を付与する。\n\n    推奨候補条件:\n        - 必要購入額が予算以内\n        - 丸め後のモデル上の推定払戻額が目標払戻許容範囲内\n        - 推定三連複オッズが上限以内\n        - positive_ev_only=True の場合は期待値がプラス\n    \"\"\"\n\n    if payout_lower_ratio >= payout_upper_ratio:\n        raise ValueError(\"目標払戻許容下限は上限より小さい必要があります。\")\n    if budget <= 0:\n        raise ValueError(\"総予算は正の整数である必要があります。\")\n    if odds_cap <= 0:\n        raise ValueError(\"推定三連複オッズ上限は0より大きい必要があります。\")\n    if recommendation_mode not in RECOMMENDATION_MODES:\n        raise ValueError(f\"未知の推奨モードです: {recommendation_mode}\")\n\n    df = candidates.copy()\n    lower = float(target_payout) * float(payout_lower_ratio)\n    upper = float(target_payout) * float(payout_upper_ratio)\n\n    df[\"hit_probability_decimal\"] = pd.to_numeric(df[\"probability_percent\"], errors=\"coerce\") / 100.0\n    df[\"payout_diff\"] = pd.to_numeric(df[\"payout\"], errors=\"coerce\") - float(target_payout)\n    df[\"payout_deviation_ratio\"] = df[\"payout_diff\"].abs() / float(target_payout)\n    df[\"within_target_payout_range\"] = df[\"payout\"].between(lower, upper, inclusive=\"both\")\n    df[\"odds_cap_exceeded\"] = pd.to_numeric(df[\"odds\"], errors=\"coerce\") > float(odds_cap)\n    df[\"within_budget\"] = pd.to_numeric(df[\"stake\"], errors=\"coerce\") <= int(budget)\n    df[\"positive_ev\"] = pd.to_numeric(df[\"expected_value\"], errors=\"coerce\") > 0\n\n    df[\"score\"] = df.apply(\n        lambda row: calculate_score(row, target_payout=target_payout, mode=recommendation_mode),\n        axis=1,\n    )\n    df[\"is_recommendation_candidate\"] = (\n        df[\"within_budget\"]\n        & df[\"within_target_payout_range\"]\n        & ~df[\"odds_cap_exceeded\"]\n        & (df[\"positive_ev\"] if positive_ev_only else True)\n    )\n\n    return df\n\n\ndef recommendation_empty_reasons(\n    annotated: pd.DataFrame,\n    *,\n    positive_ev_only: bool,\n) -> list[str]:\n    \"\"\"推奨候補が0件のときの理由を生成する。\"\"\"\n\n    reasons: list[str] = []\n    if annotated.empty:\n        return [\"三連複候補が生成されませんでした。頭数と単勝オッズを確認してください。\"]\n    if not annotated[\"within_budget\"].any():\n        reasons.append(\"必要購入額が総予算以内に収まる買い目がありません。\")\n    if not annotated[\"within_target_payout_range\"].any():\n        reasons.append(\"モデル上の推定払戻額が目標払戻許容範囲内に入る買い目がありません。\")\n    if annotated[\"odds_cap_exceeded\"].all():\n        reasons.append(\"すべての買い目が推定三連複オッズ上限を超えています。\")\n    if positive_ev_only and not annotated[\"positive_ev\"].any():\n        reasons.append(\"期待値プラス条件を満たす買い目がありません。\")\n\n    combined = annotated[\n        annotated[\"within_budget\"]\n        & annotated[\"within_target_payout_range\"]\n        & ~annotated[\"odds_cap_exceeded\"]\n        & (annotated[\"positive_ev\"] if positive_ev_only else True)\n    ]\n    if combined.empty and not reasons:\n        reasons.append(\"複数条件の組み合わせにより推奨候補が0件になっています。\")\n    return reasons\n\n\ndef allocate_full_budget(\n    candidates: pd.DataFrame,\n    *,\n    budget: int,\n    unit: int,\n    max_bets: int,\n    target_payout: float,\n    recommendation_mode: str,\n    payout_upper: float | None = None,\n) -> list[dict]:\n    \"\"\"予算を使い切る前提で、上位の三連複から順に買い目を割り当てる。\n\n    各買い目を目標払戻額に近い基本購入額で買うと、セット期待値は\n        期待値 = 目標払戻額 × (選んだ買い目の的中確率合計) - 合計購入額\n    に比例する。よって、余った予算は既存買い目への上乗せではなく、\n    「まだ買っていない“2倍程度で返る”上位の買い目」を買い増す方が期待値が高い。\n\n    手順:\n        1. 推奨モードに応じた上位順（人気順または期待値順）に並べる。\n        2. 予算と最大買い目数の範囲で、上位から順に基本購入額で買い増す。\n           余りが出たら、その余りで買える次の上位買い目を探して買い足す。\n        3. これ以上、別の買い目を基本購入額で買えない端数だけは、\n           既存の上位買い目に最低購入単位ずつ上乗せして使い切る。\n        4. 最終的な購入額に合わせて払戻額・期待値・スコアを再計算する。\n\n    予算が最低購入単位で割り切れない場合のみ、単位未満の端数だけが残る。\n    \"\"\"\n\n    if budget <= 0:\n        raise ValueError(\"budget は正の整数である必要があります。\")\n    if unit <= 0:\n        raise ValueError(\"unit は正の整数である必要があります。\")\n    if max_bets < 1:\n        raise ValueError(\"max_bets は1以上である必要があります。\")\n\n    df = candidates.copy()\n    if df.empty:\n        return []\n\n    order_column = MODE_ORDER_COLUMN.get(recommendation_mode, \"probability_percent\")\n    if order_column not in df.columns:\n        order_column = \"probability_percent\"\n    # 上位＝人気(確率高)/期待値高 を先頭にする。同点は推定オッズ昇順で安定化。\n    df = df.sort_values(\n        [order_column, \"odds\"],\n        ascending=[False, True],\n    ).reset_index(drop=True)\n\n    rows: list[dict] = []\n    for _, row in df.iterrows():\n        base_stake = int(round(float(row.get(\"stake\", 0))))\n        if base_stake <= 0:\n            continue\n        record = dict(row)\n        record[\"base_stake\"] = base_stake\n        rows.append(record)\n\n    if not rows:\n        return []\n\n    # 予算と最大買い目数の範囲で、上位から順に「別の買い目」を基本購入額で買い足す。\n    # 各反復で、現在の残予算で買える最上位の未選択買い目を1点選ぶ。\n    selected: list[dict] = []\n    selected_keys: set[str] = set()\n    total = 0\n    while len(selected) < int(max_bets):\n        remaining = int(budget) - total\n        pick = None\n        for record in rows:\n            if record[\"bet\"] in selected_keys:\n                continue\n            if record[\"base_stake\"] <= remaining:\n                pick = record\n                break\n        if pick is None:\n            break\n        chosen = dict(pick)\n        chosen[\"stake\"] = int(pick[\"base_stake\"])\n        selected.append(chosen)\n        selected_keys.add(pick[\"bet\"])\n        total += int(pick[\"base_stake\"])\n\n    if not selected:\n        return []\n\n    # これ以上、別の買い目を基本購入額で買えない端数だけ、上位の買い目に上乗せして使い切る。\n    # ただし、上乗せで払戻が許容上限を超えないようにする（超高配当化を防ぐ）。\n    leftover = int(budget) - total\n    eps = 1e-9\n    while leftover >= int(unit):\n        progressed = False\n        for record in selected:  # 上位から順に\n            if leftover < int(unit):\n                break\n            new_stake = int(record[\"stake\"]) + int(unit)\n            new_payout = new_stake * float(record[\"odds\"])\n            if payout_upper is not None and new_payout > float(payout_upper) + eps:\n                continue\n            record[\"stake\"] = new_stake\n            leftover -= int(unit)\n            progressed = True\n        if not progressed:\n            break\n\n    # 上乗せ後の購入額に合わせて各指標を再計算する。\n    for record in selected:\n        record.pop(\"base_stake\", None)\n        stake = int(record[\"stake\"])\n        odds = float(record[\"odds\"])\n        probability = float(record.get(\"probability_percent\", 0.0)) / 100.0\n        payout = stake * odds\n        record[\"payout\"] = float(payout)\n        record[\"expected_value\"] = float(probability * payout - stake)\n        record[\"payout_diff\"] = float(payout - float(target_payout))\n        record[\"score\"] = float(\n            calculate_score(record, target_payout=target_payout, mode=recommendation_mode)\n        )\n\n    return selected\n", "src/ocr.py": "\"\"\"画像から馬番・馬名・単勝オッズを抽出するOCR補助機能。\n\nGoogle Gemini API（無料枠あり）の画像入力を使う。公開GitHub Pages上で\nAPIキーを直接扱うのは推奨しないため、主にローカルStreamlit実行向け。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport base64\nimport json\nimport mimetypes\nimport re\nimport time\nfrom dataclasses import dataclass\n\nimport pandas as pd\n\n# 既定の各プロバイダのモデル名。\nDEFAULT_GEMINI_MODEL = \"gemini-2.5-flash-lite\"\n\nOCR_PROMPT = \"\"\"\n画像には競馬の出馬表・オッズ表が写っています。\n馬番、馬名、単勝オッズを読み取り、次のJSON配列だけを返してください。\n説明文、Markdown、コードフェンスは不要です。\n\n[\n  {\"horse_number\": 1, \"horse_name\": \"馬名\", \"win_odds\": 12.3}\n]\n\n注意:\n- 単勝オッズだけを抽出してください。\n- 複勝、馬連、三連複など他のオッズは無視してください。\n- 読み取れない馬名は空文字にしてください。\n- horse_number は整数、win_odds は小数で返してください。\n\"\"\"\n\n\n@dataclass\nclass OcrResult:\n    dataframe: pd.DataFrame\n    raw_text: str\n\n\ndef image_bytes_to_data_url(image_bytes: bytes, filename: str | None = None) -> str:\n    \"\"\"画像bytesをbase64 data URLに変換する。\"\"\"\n\n    mime = \"image/png\"\n    if filename:\n        guessed, _ = mimetypes.guess_type(filename)\n        if guessed and guessed.startswith(\"image/\"):\n            mime = guessed\n    encoded = base64.b64encode(image_bytes).decode(\"utf-8\")\n    return f\"data:{mime};base64,{encoded}\"\n\n\ndef _extract_json_array(text: str) -> list[dict]:\n    \"\"\"モデル応答からJSON配列を取り出す。\"\"\"\n\n    cleaned = text.strip()\n    # ```json ... ``` に包まれた場合に対応\n    fence_match = re.search(r\"```(?:json)?\\s*(.*?)```\", cleaned, flags=re.S)\n    if fence_match:\n        cleaned = fence_match.group(1).strip()\n\n    try:\n        parsed = json.loads(cleaned)\n    except json.JSONDecodeError:\n        # 応答文中の最初の配列らしき部分を拾う\n        array_match = re.search(r\"\\[\\s*\\{.*\\}\\s*\\]\", cleaned, flags=re.S)\n        if not array_match:\n            raise\n        parsed = json.loads(array_match.group(0))\n\n    if isinstance(parsed, dict) and \"horses\" in parsed:\n        parsed = parsed[\"horses\"]\n    if not isinstance(parsed, list):\n        raise ValueError(\"OCR結果がJSON配列ではありません。\")\n    return parsed\n\n\ndef normalize_ocr_records(records: list[dict]) -> pd.DataFrame:\n    \"\"\"OCR結果を horse_number / horse_name / win_odds のDataFrameに正規化する。\"\"\"\n\n    rows: list[dict] = []\n    for record in records:\n        horse_number = (\n            record.get(\"horse_number\")\n            or record.get(\"number\")\n            or record.get(\"馬番\")\n            or record.get(\"umaban\")\n        )\n        horse_name = (\n            record.get(\"horse_name\")\n            or record.get(\"name\")\n            or record.get(\"馬名\")\n            or \"\"\n        )\n        win_odds = (\n            record.get(\"win_odds\")\n            or record.get(\"odds\")\n            or record.get(\"単勝オッズ\")\n            or record.get(\"単勝\")\n        )\n\n        if horse_number in (None, \"\") or win_odds in (None, \"\"):\n            continue\n\n        rows.append(\n            {\n                \"horse_number\": horse_number,\n                \"horse_name\": horse_name,\n                \"win_odds\": win_odds,\n            }\n        )\n\n    df = pd.DataFrame(rows, columns=[\"horse_number\", \"horse_name\", \"win_odds\"])\n    if df.empty:\n        return df\n\n    df[\"horse_number\"] = pd.to_numeric(df[\"horse_number\"], errors=\"coerce\")\n    df[\"win_odds\"] = (\n        df[\"win_odds\"]\n        .astype(str)\n        .str.replace(\"倍\", \"\", regex=False)\n        .str.replace(\",\", \"\", regex=False)\n        .str.strip()\n    )\n    df[\"win_odds\"] = pd.to_numeric(df[\"win_odds\"], errors=\"coerce\")\n    df = df.dropna(subset=[\"horse_number\", \"win_odds\"]).copy()\n    df[\"horse_number\"] = df[\"horse_number\"].astype(int)\n    df[\"horse_name\"] = df[\"horse_name\"].fillna(\"\").astype(str)\n    df[\"win_odds\"] = df[\"win_odds\"].astype(float)\n    df = df.sort_values(\"horse_number\").reset_index(drop=True)\n    return df\n\n\ndef _guess_mime(filename: str | None) -> str:\n    if filename:\n        guessed, _ = mimetypes.guess_type(filename)\n        if guessed and guessed.startswith(\"image/\"):\n            return guessed\n    return \"image/png\"\n\n\ndef _call_gemini(image_bytes: bytes, filename: str | None, api_key: str, model: str) -> str:\n    try:\n        from google import genai\n        from google.genai import types\n    except Exception as exc:  # pragma: no cover - 環境依存\n        raise RuntimeError(\n            \"google-genai パッケージがインストールされていません。\"\n            \" `python3 -m pip install -r requirements.txt` を実行してください。\"\n        ) from exc\n\n    client = genai.Client(api_key=api_key)\n    image_part = types.Part.from_bytes(data=image_bytes, mime_type=_guess_mime(filename))\n    # 503(UNAVAILABLE)や一時的な混雑は自動で数回リトライする。\n    max_attempts = 4\n    last_exc: Exception | None = None\n    for attempt in range(max_attempts):\n        try:\n            response = client.models.generate_content(\n                model=model,\n                contents=[OCR_PROMPT, image_part],\n            )\n            return getattr(response, \"text\", \"\") or str(response)\n        except Exception as exc:  # pragma: no cover - API依存\n            message = str(exc)\n            last_exc = exc\n            is_quota = (\n                \"429\" in message\n                or \"RESOURCE_EXHAUSTED\" in message\n                or \"Quota exceeded\" in message\n            )\n            is_transient = (\n                \"503\" in message\n                or \"UNAVAILABLE\" in message\n                or \"high demand\" in message\n                or \"overloaded\" in message\n                or \"500\" in message\n                or \"INTERNAL\" in message\n            )\n            if is_quota:\n                raise RuntimeError(\n                    \"Gemini APIの無料枠またはレート制限に達しています。\"\n                    \" 少し待って再試行するか、別のGoogle AI Studio APIキー/プロジェクトを使う、\"\n                    \" またはGoogle AI StudioのUsage/Rate limitでクォータを確認してください。\"\n                ) from exc\n            if is_transient and attempt < max_attempts - 1:\n                # 指数バックオフ（2,4,8秒）で待ってから再試行する。\n                time.sleep(2 ** (attempt + 1))\n                continue\n            if is_transient:\n                raise RuntimeError(\n                    \"Gemini APIが一時的に高負荷（503）です。数回再試行しましたが応答がありませんでした。\"\n                    \" 少し時間をおいて再試行するか、モデルを gemini-2.5-flash / gemini-2.0-flash に変えて試してください。\"\n                ) from exc\n            raise\n    # ここには通常到達しない\n    raise RuntimeError(f\"Gemini API呼び出しに失敗しました: {last_exc}\")\n\n\ndef extract_horse_odds_from_image(\n    *,\n    image_bytes: bytes,\n    filename: str | None,\n    api_key: str,\n    provider: str = \"gemini\",\n    model: str | None = None,\n) -> OcrResult:\n    \"\"\"画像から馬番・馬名・単勝オッズを抽出する。\n\n    Args:\n        provider: \"gemini\"（現在はGeminiのみ対応）。\n        model: 省略時はプロバイダ既定モデルを使う。\n    \"\"\"\n\n    if not api_key:\n        raise ValueError(\"APIキーが空です。\")\n\n    provider = (provider or \"gemini\").lower()\n    if provider != \"gemini\":\n        raise ValueError(\n            \"現在はGemini APIのみ対応しています（無料枠運用のため）。provider='gemini' を指定してください。\"\n        )\n    used_model = model or DEFAULT_GEMINI_MODEL\n    raw_text = _call_gemini(image_bytes, filename, api_key, used_model)\n\n    records = _extract_json_array(raw_text)\n    df = normalize_ocr_records(records)\n    if df.empty:\n        raise ValueError(\"画像から馬番・単勝オッズを抽出できませんでした。\")\n    return OcrResult(dataframe=df, raw_text=raw_text)\n", "src/validation.py": "\"\"\"入力データと設定値のバリデーション。\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport pandas as pd\n\n\nREQUIRED_COLUMNS = [\"bet\", \"odds\", \"probability_percent\", \"memo\"]\n\nJAPANESE_COLUMN_MAP = {\n    \"買い目\": \"bet\",\n    \"三連複オッズ\": \"odds\",\n    \"的中確率（%）\": \"probability_percent\",\n    \"的中確率(%)\": \"probability_percent\",\n    \"的中確率\": \"probability_percent\",\n    \"メモ\": \"memo\",\n}\n\nENGLISH_COLUMN_MAP = {\n    \"bet\": \"bet\",\n    \"odds\": \"odds\",\n    \"probability_percent\": \"probability_percent\",\n    \"memo\": \"memo\",\n}\n\n\n@dataclass\nclass ValidationResult:\n    is_valid: bool\n    errors: list[str]\n    warnings: list[str]\n\n\ndef normalize_input_dataframe(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"英語列名・日本語列名のCSVを内部列名へ正規化する。\"\"\"\n\n    if df is None or df.empty:\n        return pd.DataFrame(columns=REQUIRED_COLUMNS)\n\n    normalized = df.copy()\n    rename_map: dict[str, str] = {}\n    for column in normalized.columns:\n        stripped = str(column).strip()\n        if stripped in JAPANESE_COLUMN_MAP:\n            rename_map[column] = JAPANESE_COLUMN_MAP[stripped]\n        elif stripped in ENGLISH_COLUMN_MAP:\n            rename_map[column] = ENGLISH_COLUMN_MAP[stripped]\n\n    normalized = normalized.rename(columns=rename_map)\n\n    for column in REQUIRED_COLUMNS:\n        if column not in normalized.columns:\n            normalized[column] = \"\" if column in {\"bet\", \"memo\"} else 0.0\n\n    normalized = normalized[REQUIRED_COLUMNS].copy()\n    normalized[\"bet\"] = normalized[\"bet\"].fillna(\"\").astype(str).str.strip()\n    normalized[\"memo\"] = normalized[\"memo\"].fillna(\"\").astype(str)\n    normalized[\"odds\"] = pd.to_numeric(normalized[\"odds\"], errors=\"coerce\")\n    normalized[\"probability_percent\"] = pd.to_numeric(\n        normalized[\"probability_percent\"],\n        errors=\"coerce\",\n    )\n    return normalized\n\n\ndef validate_settings(\n    budget: int,\n    target_multiplier: float,\n    unit: int,\n    max_bets: int,\n) -> ValidationResult:\n    errors: list[str] = []\n    warnings: list[str] = []\n\n    if int(budget) <= 0:\n        errors.append(\"総予算は正の整数で入力してください。\")\n    if float(target_multiplier) <= 0:\n        errors.append(\"目標回収倍率は正の数で入力してください。\")\n    if int(unit) <= 0:\n        errors.append(\"最低購入単位は正の整数で入力してください。\")\n    if int(max_bets) < 1:\n        errors.append(\"最大買い目数は1以上で入力してください。\")\n\n    return ValidationResult(is_valid=not errors, errors=errors, warnings=warnings)\n\n\ndef validate_bet_dataframe(df: pd.DataFrame) -> ValidationResult:\n    \"\"\"買い目入力の検証を行う。\"\"\"\n\n    errors: list[str] = []\n    warnings: list[str] = []\n\n    if df.empty:\n        errors.append(\"買い目データを1件以上入力してください。\")\n        return ValidationResult(False, errors, warnings)\n\n    duplicated_bets = sorted(\n        {\n            bet\n            for bet in df.loc[df[\"bet\"].duplicated(keep=False), \"bet\"].tolist()\n            if str(bet).strip()\n        }\n    )\n\n    for idx, row in df.iterrows():\n        line = int(idx) + 1\n        bet = str(row.get(\"bet\", \"\")).strip()\n        odds = row.get(\"odds\")\n        probability = row.get(\"probability_percent\")\n\n        if not bet:\n            errors.append(f\"{line}行目: 買い目が空です。\")\n\n        if pd.isna(odds):\n            errors.append(f\"{line}行目: 三連複オッズを数値で入力してください。\")\n        elif float(odds) <= 1.0:\n            errors.append(f\"{line}行目: オッズは1.0より大きい値で入力してください。\")\n\n        if pd.isna(probability):\n            errors.append(f\"{line}行目: 的中確率（%）を数値で入力してください。\")\n        elif float(probability) < 0 or float(probability) > 100:\n            errors.append(f\"{line}行目: 的中確率（%）は0以上100以下で入力してください。\")\n\n    if duplicated_bets:\n        errors.append(\"買い目が重複しています: \" + \", \".join(duplicated_bets))\n\n    probability_sum = pd.to_numeric(df[\"probability_percent\"], errors=\"coerce\").fillna(0).sum()\n    if probability_sum > 100:\n        warnings.append(\n            f\"入力された的中確率の合計が100%を超えています（合計: {probability_sum:.2f}%）。\"\n        )\n\n    return ValidationResult(is_valid=not errors, errors=errors, warnings=warnings)\n", "src/sample_data.py": "\"\"\"Streamlit 初期表示用サンプルデータ。\"\"\"\n\nfrom __future__ import annotations\n\nimport pandas as pd\n\n\ndef get_sample_data() -> pd.DataFrame:\n    \"\"\"サンプル買い目データを返す。\"\"\"\n\n    return pd.DataFrame(\n        [\n            {\"bet\": \"1-2-3\", \"odds\": 10.0, \"probability_percent\": 15.0, \"memo\": \"本命寄り\"},\n            {\"bet\": \"1-2-4\", \"odds\": 18.0, \"probability_percent\": 8.0, \"memo\": \"中穴\"},\n            {\"bet\": \"1-3-5\", \"odds\": 35.0, \"probability_percent\": 4.0, \"memo\": \"穴\"},\n            {\"bet\": \"2-4-7\", \"odds\": 80.0, \"probability_percent\": 1.0, \"memo\": \"大穴\"},\n            {\"bet\": \"1-5-8\", \"odds\": 55.0, \"probability_percent\": 2.5, \"memo\": \"抑え\"},\n            {\"bet\": \"3-6-9\", \"odds\": 120.0, \"probability_percent\": 0.8, \"memo\": \"超穴\"},\n        ]\n    )\n"}</script>
